# Real training config — targets a GPU. ClinicalBERT + BioBERT are fine-tuned
# (freeze_text_encoders: false), which is not practical on this dev machine's
# CPU-only ~8GB RAM setup; run this on Colab/cloud/a GPU box.
device: cuda
seed: 0

max_hour: 48
ehr_d_model: 128
ehr_layers: 3
ehr_heads: 8
d_model: 256
fusion_type: amt
freeze_text_encoders: false
notes_max_length: 256
symptoms_max_length: 128

batch_size: 32
epochs: 10
lr: 2.0e-5
weight_decay: 0.01
num_workers: 4

pairing_seed: 42
pairing_temperature: 5.0
val_frac: 0.15
test_frac: 0.15

checkpoint_dir: checkpoints/trimodal
